name: CI Quality Gate — Alquimia LMS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    name: TypeScript, Vitest & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          CEREBRO_PY_URL: ${{ secrets.CEREBRO_PY_URL || 'http://127.0.0.1:8155' }}

  python-quality:
    name: Pytest & Deterministic Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: cerebro-py/requirements.txt
      - run: pip install -r cerebro-py/requirements.txt
      - name: Run Pytest
        env:
          PYTHONPATH: cerebro-py
        run: pytest cerebro-py/tests/ -v
      - name: Run Deterministic Evals Gate
        env:
          PYTHONPATH: cerebro-py
        run: python -m evals.run_evals --mode deterministic
      - name: Run RAG Semantic Evals Gate
        env:
          PYTHONPATH: cerebro-py
        run: python -m evals.rag_evals --mode deterministic

  e2e-playwright:
    name: E2E Playwright Critical Flows
    runs-on: ubuntu-latest
    needs: [frontend-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  infra-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'
      - name: Terraform fmt & validate
        working-directory: infra
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
