          NEXT_PUBLIC_N8N_CEREBRO_URL: "https://cerebro.agencialquimia.com/webhook/cerebro-nutricionista"
          PUBLIC_SUPABASE_URL: "https://ybqzcxabblyzqhezanaf.supabase.co"
